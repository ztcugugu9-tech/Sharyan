<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharyan</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
}

/* HEADER */
.header{
background:linear-gradient(to right,#1e3a8a,#16a34a);
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header .left{
display:flex;
align-items:center;
gap:10px;
}

.icon{
font-size:20px;
cursor:pointer;
}

/* SEARCH */
.search{
padding:10px;
}
.search input{
width:100%;
padding:12px;
border-radius:25px;
border:none;
background:#0f172a;
color:white;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
}

.card{
background:#0f172a;
border-radius:15px;
padding:10px;
text-align:center;
}

.card img{
width:70px;
border-radius:50%;
}

/* BOTTOM */
.bottom{
position:fixed;
bottom:0;
width:100%;
background:#020617;
display:flex;
justify-content:space-around;
padding:10px;
}

/* SIDEBAR */
.sidebar{
position:fixed;
right:-300px;
top:0;
width:300px;
height:100%;
background:#020617;
transition:0.3s;
}

.sidebar.active{right:0;}

.menu a{
display:block;
padding:15px;
border-bottom:1px solid #111;
text-decoration:none;
color:white;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
}
.overlay.active{display:block;}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="left">
<div class="icon">⬅️</div>
<div>💰 16.513$</div>
</div>

<div class="right">
<span class="icon">🌐</span>
<span class="icon" onclick="openMenu()">☰</span>
</div>
</div>

<!-- SEARCH -->
<div class="search">
<input placeholder="بحث">
</div>

<!-- GRID -->
<div class="grid">

<script>
let apps=[
"Likee","VIP","Ahlan","Yoho","Soul","Party",
"Yudo","Tomohi","Oohla","Hapi","Chat","App"
];

apps.forEach(a=>{
document.write(`
<div class="card">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
<p>${a}</p>
</div>
`);
});
</script>

</div>

<!-- SIDEBAR -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="sidebar" id="menu">
<div style="padding:20px">
<h3>ماهر</h3>
<p>$16.513</p>
</div>

<div class="menu">
<a href="#">الرئيسية</a>
<a href="#">إضافة رصيد</a>
<a href="#">دفعاتي</a>
<a href="#">محفظتي</a>
<a href="#">طلباتي</a>
<a href="#">وكلاؤنا</a>
<a href="#">الحماية</a>
<a href="#">تحقق الهوية</a>
<a href="#">من نحن</a>
</div>

</div>

<!-- BOTTOM -->
<div class="bottom">
<div>🏠</div>
<div>🔍</div>
<div>🛒</div>
<div>👤</div>
</div>

<script>
function openMenu(){
menu.classList.add("active");
overlay.classList.add("active");
}

function closeMenu(){
menu.classList.remove("active");
overlay.classList.remove("active");
}
</script>
<H1>الرأيسئه</H1>
</body>
</html>
