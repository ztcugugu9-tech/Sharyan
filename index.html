<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menu Pro</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0f2c;
color:white;
}

/* زر القائمة */
.menu-btn{
font-size:30px;
padding:15px;
cursor:pointer;
}

/* الخلفية */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
}

.overlay.active{
display:block;
}

/* القائمة */
.sidebar{
position:fixed;
top:0;
right:-300px;
width:300px;
height:100%;
background:#0f172a;
transition:0.3s;
overflow:auto;
}

.sidebar.active{
right:0;
}

/* الهيدر */
.profile{
text-align:center;
padding:20px;
border-bottom:1px solid #1e293b;
}

.profile img{
width:80px;
height:80px;
border-radius:50%;
}

.name{
margin-top:10px;
font-size:18px;
}

.balance{
color:#38bdf8;
font-size:20px;
margin-top:5px;
}

/* القائمة */
.menu a{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
text-decoration:none;
color:white;
border-bottom:1px solid #1e293b;
}

.menu a:hover{
background:#1e40af;
}

/* أيقونات */
.icon{
font-size:18px;
}

/* زر الوضع */
.toggle{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
}

.switch{
width:40px;
height:20px;
background:#555;
border-radius:20px;
position:relative;
cursor:pointer;
}

.switch::after{
content:"";
width:18px;
height:18px;
background:white;
position:absolute;
top:1px;
left:1px;
border-radius:50%;
transition:0.3s;
}

.switch.active{
background:#22c55e;
}

.switch.active::after{
left:21px;
}

</style>
</head>

<body>

<!-- زر -->
<div class="menu-btn" onclick="openMenu()">☰</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="sidebar" id="menu">

<!-- حساب -->
<div class="profile">
<img src="https://i.imgur.com/6VBx3io.png">
<div class="name">ماهر</div>
<div class="balance">$ 16.513</div>
</div>

<!-- القائمة -->
<div class="menu">

<a href="#">الرئيسية <span class="icon">🏠</span></a>
<a href="#">إضافة رصيد <span class="icon">💰</span></a>
<a href="#">دفعاتي <span class="icon">💳</span></a>
<a href="#">محفظتي <span class="icon">👛</span></a>
<a href="#">طلباتي <span class="icon">🛒</span></a>
<a href="#">وكلاؤنا <span class="icon">🤝</span></a>
<a href="#">الحماية <span class="icon">🛡️</span></a>
<a href="#">تحقق الهوية <span class="icon">✔️</span></a>
<a href="#">من نحن <span class="icon">ℹ️</span></a>

</div>

<!-- الوضع -->
<div class="toggle">
<span>الوضع الداكن</span>
<div class="switch" onclick="toggleMode(this)"></div>
</div>

</div>

<script>

function openMenu(){
document.getElementById("menu").classList.add("active");
document.getElementById("overlay").classList.add("active");
}

function closeMenu(){
document.getElementById("menu").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}

function toggleMode(el){
el.classList.toggle("active");

if(document.body.style.background == "white"){
document.body.style.background = "#0b0f2c";
document.body.style.color = "white";
}else{
document.body.style.background = "white";
document.body.style.color = "black";
}
}

</script>

</body>
</html>
