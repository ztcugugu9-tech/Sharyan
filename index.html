<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر</title>

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
}

/* HEADER */
.header{
background:linear-gradient(to right,#1e3a8a,#16a34a);
padding:10px;
display:flex;
justify-content:space-between;
}

.balance{
font-weight:bold;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:#0f172a;
border-radius:15px;
padding:10px;
text-align:center;
}

.card img{
width:70px;
border-radius:10px;
}

button{
margin:5px;
padding:8px;
border:none;
border-radius:8px;
cursor:pointer;
}

.buy{background:#16a34a;}
.sell{background:#dc2626;}

/* SIDEBAR */
.sidebar{
position:fixed;
right:-260px;
top:0;
width:260px;
height:100%;
background:#020617;
transition:0.3s;
}

.sidebar.active{right:0;}

.menu a{
display:block;
padding:15px;
border-bottom:1px solid #111;
color:white;
text-decoration:none;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
}
.overlay.active{display:block;}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="balance">💰 <span id="balance">100</span>$</div>
<div onclick="openMenu()">☰</div>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- SIDEBAR -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="sidebar" id="menu">
<h3 style="padding:15px">ماهر</h3>
<div class="menu">
<a href="#">الرئيسية</a>
<a href="#">محفظتي</a>
<a href="#">طلباتي</a>
<a href="#">الإعدادات</a>
</div>
</div>

<script>

let balance = 100;

// منتجات
let products = [
{name:"منتج 1", price:10},
{name:"منتج 2", price:15},
{name:"منتج 3", price:20},
{name:"منتج 4", price:25},
{name:"منتج 5", price:30},
{name:"منتج 6", price:35},
{name:"منتج 7", price:40},
{name:"منتج 8", price:45},
{name:"منتج 9", price:50},
{name:"منتج 10", price:60},
];

let grid = document.getElementById("grid");

// عرض المنتجات
products.forEach((p,i)=>{
grid.innerHTML += `
<div class="card">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
<h3>${p.name}</h3>
<p>${p.price}$</p>

<button class="buy" onclick="buy(${i})">شراء</button>
<button class="sell" onclick="sell(${i})">بيع</button>

</div>
`;
});

// شراء
function buy(i){
if(balance >= products[i].price){
balance -= products[i].price;
update();
alert("تم الشراء");
}else{
alert("رصيدك غير كافي");
}
}

// بيع
function sell(i){
balance += products[i].price;
update();
alert("تم البيع");
}

// تحديث الرصيد
function update(){
document.getElementById("balance").innerText = balance;
}

// القائمة
function openMenu(){
menu.classList.add("active");
overlay.classList.add("active");
}

function closeMenu(){
menu.classList.remove("active");
overlay.classList.remove("active");
}

</script>

</body>
</html>
