<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Pro</title>

<style>
body{margin:0;font-family:Arial;background:#050816;color:white}

/* login */
.login{
display:flex;
flex-direction:column;
gap:10px;
padding:50px;
text-align:center;
}

.login input{
padding:10px;
}

button{
padding:10px;
background:#2563eb;
color:white;
border:none;
}

/* app */
.hidden{display:none}

.header{
background:#111;
padding:15px;
display:flex;
justify-content:space-between;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:#0f172a;
padding:15px;
text-align:center;
border-radius:10px;
}

.card img{width:60px}

/* sidebar */
.sidebar{
position:fixed;
right:-280px;
top:0;
width:280px;
height:100%;
background:#020617;
transition:0.3s;
padding:10px;
}

.sidebar.active{right:0}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
}

.overlay.active{display:block}
</style>
</head>

<body>

<!-- تسجيل دخول -->
<div id="loginPage" class="login">
<h2>تسجيل الدخول</h2>
<input id="user" placeholder="اسم المستخدم">
<input id="pass" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<button onclick="register()">تسجيل</button>
</div>

<!-- التطبيق -->
<div id="app" class="hidden">

<div class="header">
<div id="balance">$0</div>
<div onclick="openMenu()">☰</div>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="sidebar" id="menu">
<h3 id="username"></h3>
<p id="balance2"></p>
</div>

<div style="padding:10px">
<input id="appName" placeholder="اسم التطبيق">
<input type="file" id="imgUpload">
<button onclick="addApp()">إضافة تطبيق</button>
</div>

</div>

<script>

// تحميل بيانات
let userData = JSON.parse(localStorage.getItem("userData")) || null;
let apps = JSON.parse(localStorage.getItem("apps")) || [];

// تسجيل
function register(){
let u = user.value;
let p = pass.value;

if(u && p){
localStorage.setItem("account", JSON.stringify({u,p}));
alert("تم التسجيل");
}
}

// دخول
function login(){
let acc = JSON.parse(localStorage.getItem("account"));

if(acc && user.value == acc.u && pass.value == acc.p){
userData = {
name: acc.u,
balance: "$100"
};
localStorage.setItem("userData", JSON.stringify(userData));
startApp();
}else{
alert("خطأ");
}
}

// بدء التطبيق
function startApp(){
loginPage.style.display="none";
app.classList.remove("hidden");

document.getElementById("username").innerText=userData.name;

// API (رصيد وهمي)
fetch("https://api.coindesk.com/v1/bpi/currentprice.json")
.then(res=>res.json())
.then(data=>{
let price = data.bpi.USD.rate;
userData.balance="$"+price;
localStorage.setItem("userData", JSON.stringify(userData));
update();
});

update();
}

// عرض التطبيقات
function update(){
balance.innerText=userData.balance;
balance2.innerText=userData.balance;

grid.innerHTML="";
apps.forEach(app=>{
grid.innerHTML+=`
<div class="card">
<img src="${app.img}">
<p>${app.name}</p>
</div>`;
});
localStorage.setItem("apps",JSON.stringify(apps));
}

// إضافة تطبيق مع صورة
function addApp(){
let name=document.getElementById("appName").value;
let file=document.getElementById("imgUpload").files[0];

if(file){
let reader=new FileReader();
reader.onload=function(e){
apps.push({name,img:e.target.result});
update();
}
reader.readAsDataURL(file);
}
}

// menu
function openMenu(){
menu.classList.add("active");
overlay.classList.add("active");
}

function closeMenu(){
menu.classList.remove("active");
overlay.classList.remove("active");
}

// تشغيل تلقائي
if(localStorage.getItem("userData")){
userData=JSON.parse(localStorage.getItem("userData"));
startApp();
}

</script>

</body>
</html>
